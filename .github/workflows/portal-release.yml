name: Portal release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vVERSION tag with a Sigil draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  policy:
    name: Verify release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify source, tests, and website
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/verify-portal-release.py source \
            --repo-dir "$GITHUB_WORKSPACE" \
            --release-tag "$RELEASE_TAG"
          ./scripts/tests/portal-release.sh
          ./scripts/verify-website.sh

  preview:
    name: Build unpublished ${{ matrix.target }} preview
    needs: policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: x86_64-apple-darwin
            platform: macos
            bundles: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            bundles: deb,rpm,appimage
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            bundles: msi,nsis
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Require workflow execution from the exact tag
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Install pinned Tauri CLI
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.11.3 --locked

      # No optional features: a preview build must differ from the published
      # macOS arm64 release only by target and by the absence of signing.
      - name: Build unsigned preview bundles
        shell: bash
        run: |
          cargo tauri build --ci \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            -- --locked

      - name: Collect preview artifacts and digests
        id: collect
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{ print $1 }'
            else
              shasum -a 256 "$1" | awk '{ print $1 }'
            fi
          }

          version="${RELEASE_TAG#v}"
          staging="$RUNNER_TEMP/portal-preview"
          mkdir -p "$staging"
          bundle_root="target/$TARGET/release/bundle"
          test -d "$bundle_root" || {
            echo "the bundler produced no output at $bundle_root" >&2
            exit 1
          }

          entries=""
          count=0
          while IFS= read -r artifact; do
            name="$(basename "$artifact")"
            # The manifest is assembled textually, so refuse any name that
            # could alter its structure rather than escaping after the fact.
            printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' || {
              echo "unsafe preview artifact name: $name" >&2
              exit 1
            }
            test ! -e "$staging/$name" || {
              echo "duplicate preview artifact name: $name" >&2
              exit 1
            }
            cp "$artifact" "$staging/$name"
            sha256="$(digest "$staging/$name")"
            printf '%s  %s\n' "$sha256" "$name" >"$staging/$name.sha256"
            test "$count" -eq 0 || entries="$entries,"
            entries="$entries{\"name\":\"$name\",\"sha256\":\"$sha256\"}"
            count=$((count + 1))
          done < <(find "$bundle_root" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) \
            | sort)

          test "$count" -gt 0 || {
            echo "the bundler produced no recognised preview artifact" >&2
            exit 1
          }

          cat >"$staging/preview-manifest.json" <<EOF
          {
            "artifacts": [$entries
            ],
            "format": 1,
            "git_commit": "$(git rev-parse HEAD)",
            "platform": "$PLATFORM",
            "product": "portal-client-preview",
            "published": false,
            "release_tag": "$RELEASE_TAG",
            "signed": false,
            "target": "$TARGET",
            "version": "$version"
          }
          EOF
          echo "staging=$staging" >>"$GITHUB_OUTPUT"

      - name: Attest preview build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: ${{ steps.collect.outputs.staging }}/*

      # Deliberately an Actions artifact, never a release asset. The published
      # release contract stays exactly the macOS arm64 DMG set.
      - name: Retain unpublished preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-preview-${{ inputs.tag }}-${{ matrix.target }}
          path: ${{ steps.collect.outputs.staging }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Build and publish ad-hoc macOS arm64
    needs: policy
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: main
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Require workflow execution from the exact tag
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Verify native arm64 runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.3 --locked

      # Portal has no Apple Developer ID. The packaging gate refuses to run in
      # ad-hoc mode if any Apple credential is present in the environment, so
      # this job deliberately provides none.
      - name: Build and verify ad-hoc release assets
        run: |
          release_dir="$RUNNER_TEMP/portal-release"
          mkdir -m 0700 "$release_dir"
          ./scripts/package-macos-client.sh \
            --release-tag "$RELEASE_TAG" \
            --signing adhoc \
            --output-dir "$release_dir"

      - name: Attest exact Portal build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-path: '${{ runner.temp }}/portal-release/Portal-*'

      - name: Require the exact Sigil candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName,assets)"
          test "$(jq -r '.isDraft' <<<"$release_json")" = true
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          target_contract="$(<release/sigil-target-contract.txt)"
          test "$target_contract" = linux-glibc2.17-x86_64
          sigil_asset="sigil-$RELEASE_TAG-$target_contract.tar.gz"
          expected="$(printf '%s\n' "$sigil_asset" "$sigil_asset.sha256" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          test "$actual" = "$expected" || {
            echo "draft must contain only the two verified Sigil candidate assets before Portal upload" >&2
            exit 1
          }

      - name: Upload exact Portal assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          release_dir="$RUNNER_TEMP/portal-release"
          dmg="Portal-${version}-arm64.dmg"
          checksum="${dmg}.sha256"
          manifest="Portal-${version}-arm64.json"
          gh release upload "$RELEASE_TAG" \
            "$release_dir/$dmg" \
            "$release_dir/$checksum" \
            "$release_dir/$manifest"

      - name: Verify the combined draft remains complete and unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName,assets)"
          test "$(jq -r '.isDraft' <<<"$release_json")" = true
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          target_contract="$(<release/sigil-target-contract.txt)"
          test "$target_contract" = linux-glibc2.17-x86_64
          sigil_asset="sigil-$RELEASE_TAG-$target_contract.tar.gz"
          expected="$(printf '%s\n' \
            "$sigil_asset" \
            "$sigil_asset.sha256" \
            "Portal-${version}-arm64.dmg" \
            "Portal-${version}-arm64.dmg.sha256" \
            "Portal-${version}-arm64.json" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          test "$actual" = "$expected" || {
            echo "combined draft does not match the five-asset pre-signature contract" >&2
            exit 1
          }
          asset_names="$RUNNER_TEMP/portal-release-assets.json"
          jq '[.assets[].name | select(startswith("Portal-"))]' \
            <<<"$release_json" >"$asset_names"
          python3 scripts/verify-portal-release.py release-assets \
            --release-tag "$RELEASE_TAG" \
            --names-json "$asset_names"

